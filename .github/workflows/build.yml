name: Build Synology qBittorrent SPK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # 每周日 00:00 UTC 自动检查更新

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            file_suffix: x86_64
          - arch: aarch64
            file_suffix: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest version
        id: get_version
        run: |
          LATEST_VER=$(curl -sL https://github.com/userdocs/qbittorrent-nox-static/releases/latest/download/dependency-version.json | jq -r '.qbittorrent')
          echo "qbt_version=${LATEST_VER}" >> $GITHUB_OUTPUT

      - name: Prepare SPK Structure
        run: |
          # 1. 创建打包临时目录
          mkdir -p target_build/bin
          
          # 2. 下载最新版官方程序并赋权
          echo "Downloading qBittorrent ${{ steps.get_version.outputs.qbt_version }} for ${{ matrix.arch }}..."
          wget -O target_build/bin/qbittorrent-nox "https://github.com/userdocs/qbittorrent-nox-static/releases/latest/download/${{ matrix.file_suffix }}-qbittorrent-nox"
          chmod +x target_build/bin/qbittorrent-nox
          
          # 3. 把你上传的 qbmonitor 复制进 bin 目录并赋权
          echo "Copying qbmonitor..."
          cp bin/qbmonitor target_build/bin/qbmonitor
          chmod +x target_build/bin/qbmonitor
          
          # 4. 复制 UI 资源文件夹
          cp -r ui target_build/
          
          # 5. 将组装好的内容打包成群晖需要的 package.tgz
          cd target_build
          tar -czf ../package.tgz *
          cd ..

      - name: Update INFO
        run: |
          FULL_VERSION="${{ steps.get_version.outputs.qbt_version }}-${{ github.run_number }}"
          echo "Updating INFO to version: ${FULL_VERSION}"
          sed -i "s/^version=\".*\"/version=\"${FULL_VERSION}\"/" INFO
          sed -i "s/^arch=\".*\"/arch=\"${{ matrix.arch }}\"/" INFO
          cat INFO

      - name: Pack SPK
        run: |
          # 将生成的 package.tgz 和所有配置文件打包成最终的 .spk
          tar -cf qbittorrent.spk package.tgz INFO scripts/ conf/ WIZARD_UIFILES/
          chmod 755 qbittorrent.spk
          
          # 重命名为带版本号和架构的文件名
          NEW_NAME="qBittorrent-${{ matrix.arch }}-${{ steps.get_version.outputs.qbt_version }}-${{ github.run_number }}.spk"
          mv qbittorrent.spk "${NEW_NAME}"
          ls -la *.spk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-spk-${{ matrix.arch }}
          path: "*.spk"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }} - qBittorrent ${{ needs.build.outputs.qbt_version }}
          files: artifacts/**/*.spk
