name: Build Synology qBittorrent SPK

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: '0 0 * * 0' # 每周日自动运行，检查上游是否有新版

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            file_suffix: x86_64
          - arch: aarch64
            file_suffix: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest version
        id: get_version
        run: |
          LATEST_VER=$(curl -sL https://github.com/userdocs/qbittorrent-nox-static/releases/latest/download/dependency-version.json | jq -r '.qbittorrent')
          echo "qbt_version=${LATEST_VER}" >> $GITHUB_OUTPUT

      - name: Prepare SPK Structure
        run: |
          # 1. 创建组装目录
          mkdir -p target_build/bin
          
          # 2. 自动下载最新的程序本体
          echo "正在下载 qBittorrent ${{ steps.get_version.outputs.qbt_version }} (${{ matrix.arch }})..."
          wget -O target_build/bin/qbittorrent-nox "https://github.com/userdocs/qbittorrent-nox-static/releases/latest/download/${{ matrix.file_suffix }}-qbittorrent-nox"
          chmod +x target_build/bin/qbittorrent-nox
          
          # 3. 把你上传的 ui 文件夹复制进去
          cp -r ui target_build/
          
          # 4. 组装生成 package.tgz
          cd target_build
          tar -czf ../package.tgz *
          cd ..

      - name: Update INFO
        run: |
          FULL_VERSION="${{ steps.get_version.outputs.qbt_version }}-${{ github.run_number }}"
          sed -i "s/^version=\".*\"/version=\"${FULL_VERSION}\"/" INFO
          sed -i "s/^arch=\".*\"/arch=\"${{ matrix.arch }}\"/" INFO
          
      - name: Pack SPK
        run: |
          # 把生成的最新 package.tgz 和所有配置一起打包装箱
          tar -cf qbittorrent.spk package.tgz INFO scripts/ conf/ WIZARD_UIFILES/
          chmod 755 qbittorrent.spk
          
          NEW_NAME="qBittorrent-${{ matrix.arch }}-${{ steps.get_version.outputs.qbt_version }}-${{ github.run_number }}.spk"
          mv qbittorrent.spk "${NEW_NAME}"
          ls -la *.spk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qbittorrent-spk-${{ matrix.arch }}
          path: "*.spk"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }} - qBittorrent ${{ needs.build.outputs.qbt_version }}
          files: artifacts/**/*.spk
